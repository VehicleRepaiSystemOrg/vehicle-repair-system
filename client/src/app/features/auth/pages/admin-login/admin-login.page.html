<vrms-auth-shell [heroImageUrl]="heroImageUrl">
  <div class="auth-form">
    <h1 class="auth-form__title">Welcome Back</h1>
    <p class="auth-form__subtitle">Enter your details to access your dashboard.</p>

    <form class="auth-form__body" [formGroup]="form" (ngSubmit)="submit()">
      <label class="auth-form__label" for="email">Email</label>
      <input
        id="email"
        class="text-input"
        type="email"
        autocomplete="email"
        placeholder=""
        formControlName="email"
      />
      <div
        class="auth-form__hint"
        *ngIf="form.controls.email.touched && form.controls.email.invalid"
      >
        Enter a valid email.
      </div>

      <label class="auth-form__label auth-form__label--spaced" for="password">Password</label>
      <input
        id="password"
        class="text-input"
        type="password"
        autocomplete="current-password"
        placeholder=""
        formControlName="password"
      />
      <div
        class="auth-form__hint"
        *ngIf="form.controls.password.touched && form.controls.password.invalid"
      >
        Password must be at least 6 characters.
      </div>

      <div class="auth-form__error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button class="btn btn--primary" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Log in' }}
      </button>

      <a class="auth-form__support" routerLink="/support"> Trouble logging in? Contact support </a>
    </form>
  </div>
</vrms-auth-shell>
