<div class="topbar">
  <div class="topbar__title">
    <h1 class="topbar__title-text">{{ pageTitle$ | async }}</h1>
  </div>

  <div class="topbar__spacer"></div>

  <div class="topbar__search">
    <svg 
      class="topbar__search-icon" 
      width="24" 
      height="24" 
      viewBox="0 0 24 24" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg"
    >
      <path 
        d="M16 16L21 21" 
        stroke="#8E44AD" 
        stroke-width="3" 
        stroke-linecap="round"
      />
      <circle 
        cx="10.5" 
        cy="10.5" 
        r="7.5" 
        fill="#63E2FF" 
        stroke="#2980B9" 
        stroke-width="2"
      />
      <path 
        d="M13 8C12.5 7 11.5 6.5 10.5 6.5" 
        stroke="white" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.6"
      />
    </svg>

    <input
      class="topbar__input"
      type="search"
      placeholder="Search"
      [(ngModel)]="search"
      (keyup.enter)="onSearch(search)"
    />
  </div>

  <button
    class="topbar__bell"
    type="button"
    aria-label="Notifications"
    (click)="navigateToNotifications()"
  >
    🔔
  </button>
</div>
