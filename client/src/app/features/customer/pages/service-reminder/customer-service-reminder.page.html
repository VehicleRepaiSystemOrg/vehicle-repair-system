<div class="page-container">
  <header class="page__header">
    <div>
      <div class="page__welcome">
        <span class="welcome-text">your past Vehicle history</span>
        <span class="vehicle-badge">{{ vehicleLabel }}</span>
      </div>
    </div>
  </header>

  <main class="panel">
    
    <section class="section">
      <div class="section__header">
        <h2 class="section__title">Past Services</h2>
      </div>

      <div class="history-panel">
        <div class="history-table">
          <div class="history-row history-row--head">
            <span>Date</span>
            <span>Vehicle</span>
            <span>Service Performed</span>
            <span>Status</span>
            <span class="text-right">Invoice</span>
          </div>

          @for (history of serviceHistory; track history.id) {
            <div class="history-row">
              <span class="row-date">{{ history.date }}</span>
              <span class="row-vehicle">{{ history.vehicle }}</span>
              <span>{{ history.service }}</span>
              <div>
                <span class="pill pill--done">Completed</span>
              </div>
              <div class="text-right">
                <a routerLink="/dashboard/invoice-overview" class="link-action">View</a>
              </div>
            </div>
          }
        </div>
      </div>
    </section>

  </main>
</div>
