<div class="notifications-page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Notifications</h1>
      <p class="page-subtitle">Stay updated with your latest activity.</p>
    </div>
    <!-- TODO (backend): Wire "Mark All as Read" button to call markAllAsRead() method -->
    <button type="button" class="btn btn--primary" (click)="markAllAsRead()">
      Mark All as Read
    </button>
  </header>

  <section class="notifications-card">
    @for (n of notifications; track n.id) {
      <div
        class="notification-row"
        [ngClass]="{
          'notification-row--success': n.type === 'success',
          'notification-row--info': n.type === 'info',
          'notification-row--warning': n.type === 'warning'
        }"
      >
        <div class="notification-row__left">
          <div class="notification-row__icon-box">
            @if (n.type === 'success') {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
              </svg>
            }

            @if (n.type === 'info') {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 01.67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 11-.671-1.34l.041-.022zM12 9a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
              </svg>
            }

            @if (n.type === 'warning') {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
              </svg>
            }
          </div>

        <div class="notification-row__content">
          <div class="notification-row__header">
             <h3 class="notification-row__title">{{ n.title }}</h3>
             <span class="notification-row__time">{{ n.timeAgo }}</span>
          </div>
          <p class="notification-row__message">
            {{ n.message }}
          </p>
        </div>
        </div>

        <!-- TODO (backend): Wire "Mark as Read" button to call markAsRead(n.id) method -->
        <button type="button" class="btn btn--ghost btn--sm" (click)="markAsRead(n.id)">
          Mark as Read
        </button>
      </div>
    }
  </section>
</div>
