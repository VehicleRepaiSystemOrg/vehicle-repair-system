<div class="confirmation-page">
  <div class="confirmation-card">
    <button
      type="button"
      class="confirmation-card__close"
      routerLink="/dashboard/overview"
      aria-label="Close"
    >
      ×
    </button>

    <div class="confirmation-card__badge">
      <div class="confirmation-card__icon">✔</div>
    </div>

    <h1 class="confirmation-card__title">Payment Successful 🎉</h1>
    <p class="confirmation-card__text">
      Your payment has been successfully processed. Your booking is confirmed and we’ll see you soon at the workshop.
    </p>

    <button
      type="button"
      class="confirmation-card__button"
      routerLink="/dashboard/overview"
    >
      Continue to dashboard
    </button>
  </div>
</div>
