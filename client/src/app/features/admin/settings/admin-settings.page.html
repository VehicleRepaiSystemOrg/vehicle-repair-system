<div class="settings-wrapper">
  <!-- Section: Basic Information -->
  <div class="form-section">
    <div class="input-group">
      <label for="admin-name">Name</label>
      <input id="admin-name" type="text" placeholder="Enter name">
    </div>

    <div class="input-group">
      <label for="admin-email">Email</label>
      <input id="admin-email" type="email" placeholder="Enter email">
    </div>

    <div class="input-group">
      <label for="admin-phone">Phone Number</label>
      <input id="admin-phone" type="text" placeholder="Enter phone number">
    </div>

    <button class="btn-red small">Change</button>
  </div>

  <!-- Section: Preferences -->
  <div class="form-section mt-40">
    <h3 class="section-title">Communication Preferences</h3>
    
    <label class="checkbox-container">
      <input type="checkbox" checked>
      <span class="checkmark"></span>
      Receive email notifications about appointments
    </label>

    <label class="checkbox-container">
      <input type="checkbox">
      <span class="checkmark"></span>
      Receive SMS notifications about appointments
    </label>
  </div>

  <!-- Section: Vehicle Details -->
</div>
