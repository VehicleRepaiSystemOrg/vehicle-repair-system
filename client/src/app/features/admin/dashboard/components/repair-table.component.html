<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<div class="table-wrapper">
  <table class="repairs-table">
    <thead>
      <tr>
        <th>Customer</th>
        <th>Vehicle</th>
        <th>Service</th>
        <th>Date</th>
        <th>Time</th>
        <!-- Added alignment class for the button column -->
        <th class="text-center">Status</th>
      </tr>
    </thead>
    <tbody>
      <!-- Loop through your data. I've kept 'Liam Harper' as a fallback for your demo -->
      <tr *ngFor="let repair of repairs$ | async">
        <!-- Using the observable data when available; fallbacks kept for safety -->
        <td class="bold-text">{{ repair?.customerId ?? '—' }}</td>
        <td>{{ repair?.vehicle ?? '—' }}</td>
        <td>{{ repair?.service ?? '—' }}</td>
        <td>{{ repair?.date ?? '—' }}</td>
        <td>{{ repair?.time ?? '—' }}</td>
        <td class="text-center">
          <button class="status-pill">{{ repair?.status ?? 'Pending' }}</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
