<aside class="sidebar">
  <!-- Top Section: Profile and Main Navigation -->
  <div class="top-content">
    <div class="profile-section">
      <img src="assets/images/admin-avatar.jpg" class="avatar" alt="Admin">
      <div class="profile-info">
        <span class="name">AutoCare Admin</span>
        <span class="subtitle">management portal</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/reports" routerLinkActive="active">report</a>
      <a routerLink="/staff" routerLinkActive="active">Staff</a>
      <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
      <a routerLink="/customer_overview" routerLinkActive="active">Customer</a>
      
      <!-- Service Menu with Submenu -->
      <div class="nav-menu-item">
        <a routerLink="/service_management" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">Service</a>
        <div class="submenu">
          <a routerLink="/service_management" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="submenu-link">
            <span class="icon">📋</span>
            <span>Manage Services</span>
          </a>
          <a routerLink="/service_management/requests" routerLinkActive="active" class="submenu-link">
            <span class="icon">📧</span>
            <span>Appointment Requests</span>
          </a>
        </div>
      </div>

      <a routerLink="/messages" routerLinkActive="active">Messages</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>
  </div>

  <!-- Bottom Section: Logout -->
  <div class="bottom-content">
    <nav class="nav-menu">
    <a routerLink="/logout" routerLinkActive="active" class="logout-link">Logout</a>
    </nav>
  </div>
</aside>
