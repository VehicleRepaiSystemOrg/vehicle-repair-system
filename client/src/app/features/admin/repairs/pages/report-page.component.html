<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<div class="reports-page-wrapper">
  <!-- SECTION: Sales Overview & Filters -->
  <div class="glass-card mb-4">
    <div class="filter-header-row">
      <h3 class="section-subtitle">Sales Overview</h3>
      
      <div class="filter-controls">
        <!-- INTEGRATED CALENDAR PICKERS -->
        <div class="date-inputs">
          <!-- Start Date Group -->
          <div class="input-field date-input-group">
            <label for="startDate">Start Date</label>
            <div class="input-wrapper">
              <input 
                type="date" 
                id="startDate" 
                class="custom-input"
                [(ngModel)]="startDate" 
                (change)="onDateChange()"
              >
            </div>
          </div>

          <!-- End Date Group -->
          <div class="input-field date-input-group">
            <label for="endDate">End Date</label>
            <div class="input-wrapper">
              <input 
                type="date" 
                id="endDate" 
                class="custom-input"
                [(ngModel)]="endDate" 
                (change)="onDateChange()"
              >
            </div>
          </div>
        </div>
        
        <div class="action-buttons">
          <button class="btn-red-primary" (click)="onGenerate()">Generate Report</button>
          <button class="btn-red-primary">Export PDF</button>
        </div>
      </div>
    </div>

    <!-- UPDATED CHARTS SECTION -->
    <div class="charts-grid mt-4">
      <!-- 1. Sales Trend (Line Chart) -->
      <div class="chart-inner-card">
        <span class="card-label">Sales Trend</span>
        <!-- Total Sales summary value -->
        <h2 class="serif-font" style="color: #EA2A33; margin-top: 10px; font-weight: bold;">
          Rs. {{ report?.totalSales | number }}
        </h2>
        <div class="chart-container" style="height: 250px; position: relative;">
          <canvas baseChart
            [data]="lineChartData"
            [options]="lineChartOptions"
            [type]="'line'">
          </canvas>
        </div>
      </div>

      <!-- 2. Sales by Service (Bar Chart) -->
      <div class="chart-inner-card">
        <span class="card-label">Sales by Service Type</span>
        <!-- Service sales summary value -->
        <h2 class="serif-font" style="color: #EA2A33; margin-top: 10px; font-weight: bold;">
          Rs. 80,000
        </h2>
        <div class="chart-container" style="height: 250px; position: relative;">
          <canvas baseChart
            [data]="barChartData"
            [options]="barChartOptions"
            [type]="'bar'">
          </canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION: Recent Sales Table -->
  <div class="recent-sales-section mt-4">
    <div class="table-header-flex">
      <h3 class="section-subtitle mb-3">Recent Sales</h3>
    </div>
    
    <div class="table-container-card">
      <table class="modern-report-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Vehicle</th>
            <th>Service</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody *ngIf="report?.recentSales as sales">
          <ng-container *ngFor="let sale of sales">
            <tr>
              <td>{{ sale.date }}</td>
              <td class="bold-name">{{ sale.customer }}</td>
              <td>{{ sale.vehicle }}</td>
              <td>{{ sale.service }}</td>
              <td class="bold-amount">Rs. {{ sale.amount | number }}</td>
            </tr>
          </ng-container>
          <!-- Fallback placeholder if data hasn't loaded -->
          <tr *ngIf="!sales?.length">
            <td colspan="5" style="text-align: center; padding: 20px;">No sales found for selected range.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
