<div class="form-wrapper">
  <div class="page-header">
    <h2>Add Customer</h2>
    <button class="btn-back" (click)="goBack()">← Back</button>
  </div>
  
  <div class="form-group">
    <label for="name">Name</label>
    <!-- Added name="name" -->
    <input id="name" type="text" name="name" [(ngModel)]="customer.name" placeholder="Enter name">
  </div>

  <div class="form-group">
    <label for="name">Name</label>
    <!-- Added name="name" -->
    <input id="name" type="text" name="name" [(ngModel)]="customer.name" placeholder="Enter name">
  </div>

  <div class="vehicles-section">
    <div class="section-header">
      <h4>Vehicles</h4>
      <button type="button" class="btn-add-vehicle" (click)="addVehicle()">+ Add Vehicle</button>
    </div>

    <div class="vehicles-list">
      @for (vehicle of customer.vehicles; track vehicle; let i = $index) {
        <div class="vehicle-item">
          <div class="vehicle-fields">
            <div class="form-group">
              <label [for]="'vehicle-name-' + i">Vehicle Name</label>
              <input
                [id]="'vehicle-name-' + i"
                type="text"
                [name]="'vehicle-name-' + i"
                [(ngModel)]="customer.vehicles[i].name"
                placeholder="e.g., Toyota Camry">
            </div>

            <div class="form-group">
              <label [for]="'number-plate-' + i">Number Plate</label>
              <input
                [id]="'number-plate-' + i"
                type="text"
                [name]="'number-plate-' + i"
                [(ngModel)]="customer.vehicles[i].numberPlate"
                placeholder="e.g., ABC-1234">
            </div>
          </div>

          <button
            type="button"
            class="btn-remove-vehicle"
            (click)="removeVehicle(i)"
            [disabled]="customer.vehicles.length === 1">
          Remove
        </button>
      </div>
    }
    </div>
  </div>


  <div class="form-group">
    <label for="phone">Phone Number</label>
    <!-- Added name="phone" -->
    <input id="phone" type="text" name="phone" [(ngModel)]="customer.phone" placeholder="Enter phone">
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <!-- Added name="email" -->
    <input id="email" type="email" name="email" [(ngModel)]="customer.email" placeholder="Enter email">
  </div>

  <div class="button-group">
    <button class="btn-red" (click)="save()">Add Customer</button>
    <button class="btn-red" routerLink="/customer_overview">Cancel</button>
  </div>
</div>
