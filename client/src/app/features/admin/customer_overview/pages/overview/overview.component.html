<div class="page-container">
  <div class="header-section">
    <!-- Changed h2 class to match SCSS -->
    <h2 class="section-title">Customer Overview</h2>
    
    <div class="header-actions">
      <div class="search-container">
        <input 
          type="text" 
          class="search-input" 
          placeholder="Search customers..."
          [value]="searchQuery()"
          (input)="onSearchChange($any($event.target).value)"
        />
        <span class="search-icon">🔍</span>
      </div>
      
      <!-- Changed class from btn-add-main to btn-add-customer -->
      <button class="btn-add-customer" routerLink="add">
        <span class="plus">+</span> Add Customer
      </button>
    </div>
  </div>

  <!-- Changed class from table-card to table-card-container -->
  <div class="table-card-container">
    <!-- Added class="custom-table" to the table -->
    <table class="custom-table">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Vehicles</th>
          <th>Registered Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (c of filteredCustomers(); track c.id) {
        <tr>
          <td>
            <div class="customer-info">
              <span class="customer-name">{{ c.name }}</span>
              <span class="customer-contact">{{ c.phone }} • {{ c.email }}</span>
            </div>
          </td>
          <td>
            <div class="vehicles-list">
              @for (vehicle of c.vehicles; track vehicle.numberPlate) {
                <div class="vehicle-item">
                  {{ vehicle.name }} • {{ vehicle.numberPlate }}
                </div>
              }
            </div>
          </td>
          <td>{{ c.registeredDate }}</td>
          <td>
            <div class="action-buttons">
              <button class="btn-view" [routerLink]="['view', c.id]">View</button>
              <button class="btn-edit-action" [routerLink]="['edit', c.id]">Edit</button>
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
