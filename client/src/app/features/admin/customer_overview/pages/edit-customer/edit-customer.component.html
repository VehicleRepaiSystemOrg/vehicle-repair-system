@if (customer) {
<div class="edit-customer-container">
  <div class="page-header">
    <h2>Edit Customer</h2>
    <button class="btn-back" (click)="goBack()">← Back</button>
  </div>

  <!-- Name Field -->
  <div class="form-group">
    <label for="edit-name">Name</label>
    <input 
      id="edit-name"
      type="text" 
      name="name" 
      [(ngModel)]="customer.name" 
      placeholder="Enter name">
  </div>

  <div class="vehicles-section">
    <div class="section-header">
      <h4>Vehicles</h4>
      <button type="button" class="btn-add-vehicle" (click)="addVehicle()">+ Add Vehicle</button>
    </div>

    <div class="vehicles-list">
      @for (vehicle of customer.vehicles; track vehicle; let i = $index) {
        <div class="vehicle-item">
          <div class="vehicle-fields">
            <div class="form-group">
              <label [for]="'edit-vehicle-name-' + i">Vehicle Name</label>
              <input
                [id]="'edit-vehicle-name-' + i"
                type="text"
                [name]="'vehicle-name-' + i"
              [(ngModel)]="customer.vehicles[i].name"
              placeholder="e.g., Toyota Camry">
          </div>

          <div class="form-group">
            <label [for]="'edit-number-plate-' + i">Number Plate</label>
            <input
              [id]="'edit-number-plate-' + i"
              type="text"
              [name]="'number-plate-' + i"
              [(ngModel)]="customer.vehicles[i].numberPlate"
              placeholder="e.g., ABC-1234">
          </div>
        </div>

        <button
          type="button"
          class="btn-remove-vehicle"
          (click)="removeVehicle(i)"
          [disabled]="customer.vehicles.length === 1">
          Remove
        </button>
      </div>    }    </div>
  </div>

  <!-- Phone Number Field -->
  <div class="form-group">
    <label for="edit-phone">Phone Number</label>
    <input 
      id="edit-phone"
      type="text" 
      name="phone" 
      [(ngModel)]="customer.phone" 
      placeholder="Enter phone">
  </div>

  <!-- Email Field -->
  <div class="form-group">
    <label for="edit-email">Email</label>
    <input 
      id="edit-email"
      type="email" 
      name="email" 
      [(ngModel)]="customer.email" 
      placeholder="Enter email">
  </div>

  <!-- Unified Action Buttons -->
  <div class="button-group">
    <!-- Primary Action -->
    <button class="btn-change" (click)="save()">Change</button>
    
    <!-- Destructive Action -->
    <button class="btn-remove" (click)="onRemove()">Remove</button>
    
    <!-- Navigation/Cancel Action -->
    <button class="btn-cancel" routerLink="/customer_overview">Cancel</button>
  </div>
</div>
}
