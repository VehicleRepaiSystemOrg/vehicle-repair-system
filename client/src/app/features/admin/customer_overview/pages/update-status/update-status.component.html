<div class="status-page-container">
  
  <!-- 1. Dynamic Progress Bar -->
  <div class="progress-section">
    <div class="progress-track">
      <!-- Dynamic width based on getProgress() logic -->
      <div class="progress-fill" [style.width.%]="getProgress()"></div>
      
      <div class="dots-container">
        <!-- Dynamic active class based on isReached() logic -->
        <div class="dot" [class.active]="isReached('Pending')"></div>
        <div class="dot" [class.active]="isReached('Inspection')"></div>
        <div class="dot" [class.active]="isReached('Estimate Approved')"></div>
        <div class="dot" [class.active]="isReached('In Progress')"></div>
        <div class="dot" [class.active]="isReached('Quality Check')"></div>
        <div class="dot" [class.active]="isReached('Pickup')"></div>
      </div>
    </div>
    
    <div class="labels-container">
      <span>Pending</span>
      <span>Inspection</span>
      <span>Estimate Approved</span>
      <span>In Progress</span>
      <span>Quality Check</span>
      <span>Pickup</span>
    </div>
  </div>

  <!-- 2. Status Buttons Grid (with Click Events) -->
  <div class="status-grid">
    <button class="btn-status red" (click)="setStatus('Pending')">Pending</button>
    <button class="btn-status blue" (click)="setStatus('Inspection')">Inspection</button>
    <button class="btn-status yellow" (click)="setStatus('Estimate Approved')">Estimate Approved</button>
    <button class="btn-status orange" (click)="setStatus('In Progress')">In Progress</button>
    <button class="btn-status light-yellow" (click)="setStatus('Quality Check')">Quality Check</button>
    <button class="btn-status green" (click)="setStatus('Pickup')">Ready for Pickup</button>
  </div>

  <!-- 3. View Invoice Button -->
  <div class="navigation-section">
    <button class="btn-main-red" [routerLink]="['../../invoice', customerId]">
      View Invoice Details
    </button>
  </div>

  <!-- 4. Schedule Card (with ngModel) -->
  <div class="schedule-card">
    <h3>Schedule Next Session</h3>
    <div class="divider"></div>
    
    <div class="input-group">
      <label for="nextSessionDate">Select Date for Next Appointment</label>
      <input type="date" id="nextSessionDate" [(ngModel)]="nextSessionDate">
    </div>

    <div class="input-group">
      <label for="nextSessionTime">Select Time</label>
      <input type="time" id="nextSessionTime" [(ngModel)]="nextSessionTime">
    </div>

    <div class="input-group">
      <label for="nextSessionNotes">Notes (Optional)</label>
      <textarea 
        id="nextSessionNotes"
        [(ngModel)]="nextSessionNotes"
        placeholder="Add any notes for this appointment..."
        rows="3"
      ></textarea>
    </div>

    <button class="btn-save" (click)="saveSchedule()">📅 Save Schedule</button>
    <p style="margin-top: 15px; font-size: 12px; color: #666; font-style: italic;">
      This appointment will be automatically synced to Google Calendar.
    </p>
  </div>

</div>
