<div class="add-employee-container">
  <h2>Add Employee</h2>

  <div class="form-group">
    <label for="emp-name">Employee Name</label>
    <input id="emp-name" type="text" [(ngModel)]="employee.name" placeholder="Enter employee name">
  </div>

  <div class="form-group">
    <label for="emp-role">Role</label>
    <input id="emp-role" type="text" [(ngModel)]="employee.role" placeholder="Enter Role">
  </div>

  <div class="form-group">
    <label for="emp-phone">Phone Number</label>
    <input id="emp-phone" type="text" [(ngModel)]="employee.phone" placeholder="Enter Number">
  </div>

  <div class="button-group">
    <button class="btn-submit" (click)="onSubmit()">Add Employee</button>
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>
  </div>
</div>
